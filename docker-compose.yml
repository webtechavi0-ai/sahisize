# Local/production-like run of the standalone server:
#   PUBLIC_SITE_URL=https://sahisize.in docker compose up -d --build
# Bound to loopback only; the host nginx terminates TLS and proxies to 127.0.0.1:3003.
services:
  web:
    build:
      context: .
      target: runtime
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    image: ${IMAGE_NAME:-sahisize}:${IMAGE_TAG:-latest}
    container_name: sahisize
    ports:
      - '127.0.0.1:${HOST_PORT:-3003}:3003'
    environment:
      NODE_ENV: production
      PORT: '3003'
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      # Next may write its runtime cache here; everything served is prerendered.
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
