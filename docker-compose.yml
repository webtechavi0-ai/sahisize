services:
  web:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    image: ${IMAGE_NAME:-sahisize}:${IMAGE_TAG:-latest}
    container_name: sahisize
    ports:
      - "${HOST_PORT:-3003}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp # nginx-unprivileged keeps its pid and temp files here
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
