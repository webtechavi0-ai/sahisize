# nginx equivalent of public/_headers + public/_redirects (Cloudflare Pages).
# Keep the two in sync when either changes.

# _redirects: .html -> clean URL, trailing slash -> none. Matched on $request_uri (the
# client's original URI) so try_files' internal /exams -> /exams.html never redirects.
map $request_uri $sahisize_redirect {
    default "";
    "~^/index\.html(?<q>\?.*)?$"                  "/$q";
    "~^/hi/index\.html(?<q>\?.*)?$"               "/hi$q";
    "~^(?<p>/[^?]*)\.html(?<q>\?.*)?$"            "$p$q";
    "~^(?<p>/[^?]*[^/?])/+(?<q>\?.*)?$"           "$p$q";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;   # relative Location headers: correct behind any proxy/TLS terminator
    charset utf-8;

    # A types block here replaces the http-level map, so pull the defaults back in first.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/wasm          wasm;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json application/wasm image/svg+xml text/plain application/xml;

    error_page 404 /404.html;

    if ($sahisize_redirect) {
        return 301 $sahisize_redirect;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Engine worker: its CSP comes from its own response (second, separately enforced policy).
    location ~ ^/_astro/workers/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; object-src 'none'; base-uri 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # pdf.js worker parses untrusted PDFs: no eval at all.
    location ~ ^/_astro/pdf\.worker {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Content-hashed Vite/Astro output and the hashed Workbox runtime.
    location ~ ^/(_astro/|workbox-.*\.js$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker must always revalidate so updates reach users.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location ~ ^/og/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location ~ ^/dev/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html =404;
    }

    # HTML pages: build.format 'file' emits /exams.html, served at /exams.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri.html =404;
    }
}
