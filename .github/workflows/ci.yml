# Skeleton CI (Phase 1). Workstream H owns and completes this in Phase 3
# (e2e suites, budgets, nightly corpus matrix). SPEC 14.4: block merge on failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 21 * * *' # nightly 03:00 IST: full corpus (Phase 2/3)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Typecheck, lint, unit, schema, build, links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: i18n keys
        run: npm run i18n:check
      - name: Token contrast (WCAG AA)
        run: npm run contrast
      - name: Preset schema validation
        run: |
          npx vitest run --project node tests/contracts/presets-contract.test.ts
          if [ -f scripts/presets-check.ts ]; then npm run presets:check; fi
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Broken links
        run: npm run links
      - name: Budgets
        if: hashFiles('scripts/check-budgets.ts') != ''
        run: npm run budgets
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  lighthouse:
    name: Lighthouse CI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Lighthouse (>= 0.95 in all categories)
        run: npm run lhci

  e2e:
    # Placeholder: H adds tests/e2e/*.spec.ts in Phase 3.
    name: Playwright e2e
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Any e2e specs?
        id: specs
        run: echo "found=$(ls tests/e2e/*.spec.ts 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.specs.outputs.found != '0'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.specs.outputs.found != '0'
        run: npm ci
      - if: steps.specs.outputs.found != '0'
        run: npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v4
        if: steps.specs.outputs.found != '0'
        with:
          name: dist
          path: dist
      - if: steps.specs.outputs.found != '0'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && steps.specs.outputs.found != '0'
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  corpus:
    # Placeholder: A adds scripts/make-test-corpus.ts in Phase 2 (SPEC 14.2, PLAN 3.8).
    name: Full corpus matrix (nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: tests/fixtures/corpus
          key: corpus-${{ hashFiles('scripts/make-test-corpus.ts') }}
      - name: Generate corpus
        if: hashFiles('scripts/make-test-corpus.ts') != ''
        run: npm run corpus:make
      - name: Run corpus matrix
        if: hashFiles('scripts/make-test-corpus.ts') != ''
        run: npm run test:corpus
